<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dictionary</title>
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body class="body">
        <div class="container">
            <h1 class="title">DICTIONARY</h1>
            <div class ="search">
                <form id="form">
                    <input type="text" id="wordInput" placeholder="Enter a word" required>
                    <button type="submit" id="searchButton">Search</button>
                </form>
            </div>
            <div id="result"></div>
        </div>
        <div class="footer-container">
            <footer>
                <p class="footer-text">© <span id="year">2026</span> Dictionary App. All rights reserved.</p>
                <p class="footer-text">Created by Abdisalam Noor</p>
            </footer>
        </div>
        <script src="./js/script.js"></script>
    </body>
</html>
